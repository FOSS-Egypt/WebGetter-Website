<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGetter</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --panel-2: #0a0e13;
    --border: #232b35;
    --text: #c9d1d9;
    --muted: #6e7681;
    --accent: #00d97e;
    --accent-dim: #0a8a52;
    --accent-glow: rgba(0, 217, 126, 0.15);
    --err: #ff6b6b;
    --radius: 10px;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
  }

  html[data-theme="light"] {
    --bg: #f6f8fa;
    --panel: #ffffff;
    --panel-2: #eef1f4;
    --border: #d8dee4;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0a8a52;
    --accent-dim: #087a47;
    --accent-glow: rgba(10, 138, 82, 0.1);
    --err: #cf222e;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 20px 14px 40px;
    transition: background 0.25s ease, color 0.25s ease;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: center top;
    background-attachment: fixed;
    opacity: 0;
    animation: fadeIn 0.4s ease forwards;
  }
  html[data-theme="light"] body { background-image: none; }

  @keyframes fadeIn { to { opacity: 1; } }

  .wrap { max-width: 520px; width: 100%; }

  .topbar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-bottom: 14px;
  }

  .toggle-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 11px;
    font-family: var(--mono);
    font-size: 0.72rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
  .toggle-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.28);
  }
  html[data-theme="light"] .card { box-shadow: 0 8px 24px rgba(31,35,40,0.08); }

  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }
  .card-head span.pathline {
    margin-inline-start: 8px;
    color: var(--muted);
    font-size: 0.75rem;
    direction: ltr;
  }

  .card-body { padding: 22px 20px 20px; }

  .prompt-line {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
    direction: ltr;
    text-align: left;
  }
  .prompt-line .sym { color: var(--accent); }
  .prompt-line .cmd { color: var(--text); }
  .caret {
    display: inline-block;
    width: 7px;
    height: 1em;
    background: var(--accent);
    margin-inline-start: 2px;
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  h1 { font-size: 1.3rem; margin: 14px 0 2px; letter-spacing: -0.01em; }
  h1 .accent { color: var(--accent); }
  p.sub { color: var(--muted); margin: 0 0 22px; font-size: 0.85rem; line-height: 1.5; }

  label {
    display: block;
    font-size: 0.72rem;
    margin: 0 0 6px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.92rem;
    direction: ltr;
    text-align: left;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  input[type="text"]::placeholder { color: var(--muted); opacity: 0.7; }

  .modes { display: flex; gap: 8px; margin-top: 18px; }
  .mode-opt {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    margin: 0;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .mode-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-glow); }
  .mode-opt input { accent-color: var(--accent); margin: 0; }
  .mode-opt .mode-title { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600; }
  .mode-opt .mode-desc { font-size: 0.68rem; color: var(--muted); margin-inline-start: 18px; }

  button.run-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #06110b;
    font-family: var(--mono);
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  button.run-btn:hover:not(:disabled) { filter: brightness(1.08); }
  button.run-btn:active:not(:disabled) { transform: scale(0.99); }
  button.run-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  button.run-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #progressWrap { display: none; margin-top: 18px; }
  #progressLabel {
    font-size: 0.72rem;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 6px;
    direction: ltr;
  }
  .bar-track {
    width: 100%;
    height: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    border-radius: 5px;
    transition: width 0.25s ease;
  }

  #log {
    margin-top: 14px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 0.72rem;
    color: var(--muted);
    display: none;
    direction: ltr;
    text-align: left;
  }
  #log div { margin-bottom: 3px; word-break: break-all; }
  #log div.ok::before { content: '✓ '; color: var(--accent); }
  #log div.fail::before { content: '✗ '; color: var(--err); }
  #log div.info::before { content: '→ '; color: var(--muted); }

  #downloadWrap { display: none; margin-top: 14px; }
  a.download-btn {
    display: block;
    text-align: center;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 700;
    transition: background 0.15s ease;
  }
  a.download-btn:hover { background: var(--accent-glow); }

  #errorMsg {
    display: none;
    color: var(--err);
    margin-top: 14px;
    font-size: 0.82rem;
    background: rgba(255,107,107,0.08);
    border: 1px solid var(--err);
    border-radius: 8px;
    padding: 10px 12px;
  }
  #errorMsg::before { content: '! '; font-weight: 700; }

  footer { text-align: center; color: var(--muted); font-size: 0.68rem; margin-top: 18px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <button class="toggle-btn" id="langToggle" type="button">EN</button>
      <button class="toggle-btn" id="themeToggle" type="button">☀</button>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="pathline">~/webgetter</span>
      </div>
      <div class="card-body">
        <div class="prompt-line"><span class="sym">$</span> <span class="cmd" id="typedCmd"></span><span class="caret"></span></div>

        <h1 data-i18n="title">Web<span class="accent">Getter</span></h1>
        <p class="sub" data-i18n="subtitle">حط رابط أي موقع وهات السورس كود بتاعه في ثواني</p>

        <label for="urlInput" data-i18n="urlLabel">رابط الموقع</label>
        <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off" spellcheck="false" />

        <div class="modes">
          <label class="mode-opt">
            <div class="mode-title"><input type="radio" name="mode" value="basic" checked /> <span data-i18n="basicTitle">Basic</span></div>
            <div class="mode-desc" data-i18n="basicDesc">HTML بس</div>
          </label>
          <label class="mode-opt">
            <div class="mode-title"><input type="radio" name="mode" value="full" /> <span data-i18n="fullTitle">Full</span></div>
            <div class="mode-desc" data-i18n="fullDesc">CSS / JS / صور</div>
          </label>
        </div>

        <button class="run-btn" id="startBtn" data-i18n="runBtn">هات السورس كود</button>

        <div id="progressWrap">
          <div id="progressLabel"><span id="progressText">0%</span><span id="progressCount"></span></div>
          <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
        </div>

        <div id="errorMsg"></div>
        <div id="log"></div>

        <div id="downloadWrap">
          <a id="downloadBtn" class="download-btn" data-i18n="downloadBtn">⬇ نزّل ملف ZIP</a>
        </div>
      </div>
    </div>

    <footer data-i18n="footer">WebGetter Web — أداة مفتوحة المصدر</footer>
  </div>

<script>
const STR = {
  ar: {
    title_html: 'Web<span class="accent">Getter</span>',
    subtitle: 'حط رابط أي موقع وهات السورس كود بتاعه في ثواني',
    urlLabel: 'رابط الموقع',
    basicTitle: 'Basic',
    basicDesc: 'HTML بس',
    fullTitle: 'Full',
    fullDesc: 'CSS / JS / صور',
    runBtn: 'هات السورس كود',
    runningBtn: 'جاري السحب...',
    downloadBtn: '⬇ نزّل ملف ZIP',
    footer: 'WebGetter Web — أداة مفتوحة المصدر',
    errEmpty: 'من فضلك اكتب رابط الموقع',
    errGeneric: 'خطأ: ',
    logFetching: 'جاري سحب الصفحة الأساسية',
    logHtmlDone: 'تم سحب HTML',
    logZipping: 'جاري تجهيز ملف ZIP',
    logDone: 'تم! دوس على زرار التحميل تحت',
    progCount: (d,t) => `${d} / ${t} ملف`,
    dir: 'rtl', langCode: 'ar', toggleLabel: 'EN'
  },
  en: {
    title_html: 'Web<span class="accent">Getter</span>',
    subtitle: 'Paste any URL and get its source code in seconds',
    urlLabel: 'Website URL',
    basicTitle: 'Basic',
    basicDesc: 'HTML only',
    fullTitle: 'Full',
    fullDesc: 'CSS / JS / images',
    runBtn: 'Fetch source code',
    runningBtn: 'Fetching...',
    downloadBtn: '⬇ Download ZIP',
    footer: 'WebGetter Web — open source tool',
    errEmpty: 'Please enter a website URL',
    errGeneric: 'Error: ',
    logFetching: 'Fetching base page',
    logHtmlDone: 'HTML fetched',
    logZipping: 'Building ZIP file',
    logDone: 'Done! Tap the download button below',
    progCount: (d,t) => `${d} / ${t} files`,
    dir: 'ltr', langCode: 'en', toggleLabel: 'ع'
  }
};

const htmlRoot = document.getElementById('htmlRoot');
const langToggle = document.getElementById('langToggle');
const themeToggle = document.getElementById('themeToggle');
const startBtn = document.getElementById('startBtn');
const urlInput = document.getElementById('urlInput');
const logEl = document.getElementById('log');
const errorEl = document.getElementById('errorMsg');
const downloadWrap = document.getElementById('downloadWrap');
const downloadBtn = document.getElementById('downloadBtn');
const progressWrap = document.getElementById('progressWrap');
const progressText = document.getElementById('progressText');
const progressCount = document.getElementById('progressCount');
const barFill = document.getElementById('barFill');
const typedCmd = document.getElementById('typedCmd');

let lang = localStorage.getItem('wg_lang') || 'ar';
let theme = localStorage.getItem('wg_theme') || 'dark';

function applyTheme(t) {
  theme = t;
  htmlRoot.setAttribute('data-theme', t);
  themeToggle.textContent = t === 'dark' ? '☀' : '☾';
  localStorage.setItem('wg_theme', t);
}

function applyLang(l) {
  lang = l;
  const s = STR[l];
  htmlRoot.setAttribute('lang', s.langCode);
  htmlRoot.setAttribute('dir', s.dir);
  langToggle.textContent = s.toggleLabel;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (key === 'title') { el.innerHTML = s.title_html; return; }
    if (s[key] !== undefined) el.textContent = s[key];
  });
  localStorage.setItem('wg_lang', l);
}

themeToggle.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
langToggle.addEventListener('click', () => applyLang(lang === 'ar' ? 'en' : 'ar'));

applyTheme(theme);
applyLang(lang);

function typeCommand(text, speed = 32) {
  typedCmd.textContent = '';
  let i = 0;
  const timer = setInterval(() => {
    typedCmd.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(timer);
  }, speed);
}
typeCommand('webgetter fetch <url>');

function addLog(msg, cls) {
  logEl.style.display = 'block';
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = msg;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function setProgress(pct, doneCount, totalCount) {
  progressWrap.style.display = 'block';
  barFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  progressText.textContent = Math.round(pct) + '%';
  if (totalCount) progressCount.textContent = STR[lang].progCount(doneCount, totalCount);
}

async function runFetch() {
  const url = urlInput.value.trim();
  const mode = document.querySelector('input[name="mode"]:checked').value;
  const s = STR[lang];

  errorEl.style.display = 'none';
  downloadWrap.style.display = 'none';
  logEl.innerHTML = '';
  logEl.style.display = 'none';
  progressWrap.style.display = 'none';
  progressCount.textContent = '';
  setProgress(0, 0, 0);

  if (!url) {
    errorEl.textContent = s.errEmpty;
    errorEl.style.display = 'block';
    return;
  }

  startBtn.disabled = true;
  startBtn.textContent = s.runningBtn;
  addLog(s.logFetching, 'info');
  setProgress(5, 0, 0);

  try {
    const res = await fetch('/api/scrape', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, mode }),
    });

    if (!res.ok || !res.body) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || ('HTTP ' + res.status));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let zipBase64 = null;
    let finalError = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let nlIndex;
      while ((nlIndex = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, nlIndex);
        buffer = buffer.slice(nlIndex + 1);
        if (!line.trim()) continue;

        let evt;
        try { evt = JSON.parse(line); } catch { continue; }

        if (evt.type === 'step') {
          if (evt.label === 'html:done') {
            addLog(s.logHtmlDone, 'ok');
            setProgress(mode === 'basic' ? 90 : 15, 0, 0);
          } else if (evt.label && evt.label.startsWith('asset:')) {
            const isOk = evt.label.startsWith('asset:ok:');
            const assetUrl = evt.label.slice(evt.label.indexOf(':', 6) + 1);
            addLog(assetUrl, isOk ? 'ok' : 'fail');
            const pct = 15 + (evt.done / evt.total) * 70;
            setProgress(pct, evt.done, evt.total);
          }
        } else if (evt.type === 'total_assets') {
          setProgress(15, 0, evt.total);
        } else if (evt.type === 'zipping') {
          addLog(s.logZipping, 'info');
          setProgress(92, 0, 0);
        } else if (evt.type === 'done') {
          zipBase64 = evt.zipBase64;
          setProgress(100, 0, 0);
        } else if (evt.type === 'error') {
          finalError = evt.error;
        }
      }
    }

    if (finalError) throw new Error(finalError);
    if (!zipBase64) throw new Error('No data received');

    const byteChars = atob(zipBase64);
    const byteNums = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNums);
    const blob = new Blob([byteArray], { type: 'application/zip' });
    const dlUrl = URL.createObjectURL(blob);

    downloadBtn.href = dlUrl;
    downloadBtn.setAttribute('download', 'website-source.zip');
    downloadWrap.style.display = 'block';
    addLog(s.logDone, 'ok');
  } catch (err) {
    errorEl.textContent = s.errGeneric + err.message;
    errorEl.style.display = 'block';
  } finally {
    startBtn.disabled = false;
    startBtn.textContent = s.runBtn;
  }
}

startBtn.addEventListener('click', runFetch);
urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runFetch(); });
</script>
</body>
</html>
